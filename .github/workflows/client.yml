name: client

on:
  push:
    paths:
      - "client/**"
      - ".github/workflows/client.yml"
  pull_request:
    paths:
      - "client/**"
      - ".github/workflows/client.yml"

jobs:
  godot-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.3 and export templates
        run: |
          mkdir -p "$HOME/.local/bin" "$HOME/.local/share/godot/export_templates/4.3.stable"
          curl -fsSL "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          install -m 0755 /tmp/godot/Godot_v4.3-stable_linux.x86_64 "$HOME/.local/bin/godot"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -fsSL "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" -o /tmp/godot-templates.tpz
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"
          godot --version
      - name: Import project and validate scripts
        working-directory: client
        shell: bash
        run: |
          set -euo pipefail
          run_godot_check() {
            local log_file="$1"
            shift
            "$@" 2>&1 | tee "$log_file"
            if grep -E 'SCRIPT ERROR:|ERROR:' "$log_file"; then
              echo "::error::Godot emitted an error; refusing to treat this run as a pass."
              return 1
            fi
          }
          run_godot_check /tmp/godot-interaction-hint-test.log godot --headless --path . --script tests/interaction_hint_smoke_test.gd
          run_godot_check /tmp/godot-movement-test.log godot --headless --path . --script tests/player_controller_smoke_test.gd
          run_godot_check /tmp/godot-import.log godot --headless --editor --path . --quit
          mkdir -p build/web
          run_godot_check /tmp/godot-web-export.log godot --headless --path . --export-release "Web" build/web/index.html

  android-apk:
    needs: godot-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK build-tools and platform
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "build-tools;34.0.0" "platforms;android-34" >/dev/null
      - name: Install Godot 4.3, export templates, and debug keystore
        run: |
          mkdir -p "$HOME/.local/bin" "$HOME/.local/share/godot/export_templates/4.3.stable" "$HOME/.local/share/godot/keystores" "$HOME/.config/godot" "$HOME/.android"
          curl -fsSL "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          install -m 0755 /tmp/godot/Godot_v4.3-stable_linux.x86_64 "$HOME/.local/bin/godot"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -fsSL "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" -o /tmp/godot-templates.tpz
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"
          rm -f "$HOME/.android/debug.keystore" "$HOME/.local/share/godot/keystores/debug.keystore"
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore "$HOME/.android/debug.keystore" -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999
          cp "$HOME/.android/debug.keystore" "$HOME/.local/share/godot/keystores/debug.keystore"
          cat <<EOF > "$HOME/.config/godot/editor_settings-4.3.tres"
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/debug_keystore = "${HOME}/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/shutdown_adb_on_exit = false
          EOF
          sed -i 's/^[[:space:]]*//' "$HOME/.config/godot/editor_settings-4.3.tres"
      - name: Export Android Debug APK
        working-directory: client
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --path . --quit
          mkdir -p build/android
          godot --headless --path . --export-debug "Android" build/android/rs-galaxies-debug.apk 2>&1 | tee /tmp/godot-android-export.log
          if grep -E 'SCRIPT ERROR:|ERROR:' /tmp/godot-android-export.log; then
            echo "::error::Godot emitted an error during Android export."
            exit 1
          fi
          test -s build/android/rs-galaxies-debug.apk
      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rs-galaxies-android-debug-apk
          path: client/build/android/rs-galaxies-debug.apk
          retention-days: 14
